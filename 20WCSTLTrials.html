<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Category Sorting Game - 20 Rule Challenge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { user-select: none; -webkit-user-select: none; }
        button, select, input { touch-action: manipulation; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col items-center p-2 sm:p-6">

  <div id="app" class="w-full max-w-4xl bg-slate-900 shadow-2xl rounded-2xl overflow-hidden border border-slate-800 flex flex-col min-h-[720px]">
    <!-- Dynamic Content Injected Here -->
  </div>

  <script>
    // ==========================================
    // CONFIGURATION & CONSTANTS
    // ==========================================
    const COLORS = ["Blue", "Red", "Green", "Purple"];
    const LETTERS = ["A", "B", "C", "D"];
    const SHAPES = ["○", "□", "△", "⌂"];
    const RULES = ["Color", "Letter", "Shape"];

    const COLOR_MAP = {
        "Blue": "#1e90ff",
        "Red": "#ff4757",
        "Green": "#2ed573",
        "Purple": "#a55eea"
    };

    const TARGETS = [
        {"Color": "Blue", "Letter": "A", "Shape": "○"},
        {"Color": "Red", "Letter": "B", "Shape": "□"},
        {"Color": "Green", "Letter": "C", "Shape": "△"},
        {"Color": "Purple", "Letter": "D", "Shape": "⌂"}
    ];

    const TOTAL_BLOCKS = 20;
    const MAX_SUBTRIALS = 10;
    const MASTERY_THRESHOLD = 5;

    // ==========================================
    // STATE MANAGEMENT
    // ==========================================
    let state = {
        currentBlock: 0,
        currentSubtrial: 0,
        consecutiveCorrect: 0,
        currentRule: null,
        gameActive: false,
        blockHistory: [],
        currentBlockHits: 0,
        currentCard: null,
        feedbackText: "",
        feedbackColor: "",
        screen: "start" // "start" | "game" | "buffer" | "results"
    };

    // ==========================================
    // GAME CONTROLLER LOGIC
    // ==========================================
    function startGame() {
        state.gameActive = true;
        state.currentBlock = 0;
        state.blockHistory = [];
        startNewBlock();
    }

    function startNewBlock() {
        state.currentBlock++;
        if (state.currentBlock > TOTAL_BLOCKS) {
            stopGame();
            return;
        }

        // Pick a rule different from the previous rule if possible
        let availableRules = RULES.filter(r => r !== state.currentRule);
        state.currentRule = availableRules[Math.floor(Math.random() * availableRules.length)];

        state.currentSubtrial = 0;
        state.consecutiveCorrect = 0;
        state.currentBlockHits = 0;
        state.feedbackText = "";
        state.screen = "game";

        nextSubtrial();
    }

    function nextSubtrial() {
        if (state.currentSubtrial < MAX_SUBTRIALS) {
            state.currentSubtrial++;
            state.currentCard = {
                "Color": COLORS[Math.floor(Math.random() * COLORS.length)],
                "Letter": LETTERS[Math.floor(Math.random() * LETTERS.length)],
                "Shape": SHAPES[Math.floor(Math.random() * SHAPES.length)]
            };
            state.feedbackText = "";
            renderUI();
        } else {
            finishBlock(false);
        }
    }

    function makeChoice(targetIdx) {
        if (!state.gameActive || state.screen !== "game") return;

        let target = TARGETS[targetIdx];
        let isCorrect = (state.currentCard[state.currentRule] === target[state.currentRule]);

        if (isCorrect) {
            state.feedbackText = "✓ CORRECT";
            state.feedbackColor = "#2ed573";
            state.consecutiveCorrect++;
            state.currentBlockHits++;
        } else {
            state.feedbackText = "✗ INCORRECT";
            state.feedbackColor = "#ff4757";
            state.consecutiveCorrect = 0;
        }

        renderUI();

        setTimeout(() => {
            if (state.consecutiveCorrect >= MASTERY_THRESHOLD) {
                finishBlock(true);
            } else {
                nextSubtrial();
            }
        }, 600);
    }

    function finishBlock(mastered) {
        state.blockHistory.push({
            Block: state.currentBlock,
            Rule: state.currentRule,
            Mastered: mastered,
            Subtrials_Taken: state.currentSubtrial,
            Correct_Hits: state.currentBlockHits
        });

        if (state.currentBlock >= TOTAL_BLOCKS) {
            stopGame();
        } else {
            state.screen = "buffer";
            renderUI();
        }
    }

    function startNextBlockFromBuffer() {
        startNewBlock();
    }

    function stopGame() {
        state.gameActive = false;
        state.screen = "results";
        renderUI();
    }

    // ==========================================
    // KEYBOARD LISTENERS
    // ==========================================
    window.addEventListener('keydown', (e) => {
        if (e.key === ' ' || e.key === 'Enter') {
            if (state.screen === 'buffer') {
                startNextBlockFromBuffer();
            }
        }
        if (e.key === 's' || e.key === 'S') {
            if (state.screen === 'start') {
                startGame();
            }
        }
        if (e.key === 'q' || e.key === 'Q') {
            if (state.screen === 'results') {
                window.close();
            } else if (state.gameActive) {
                stopGame();
            }
        }
    });

    // ==========================================
    // UI RENDERING ENGINE
    // ==========================================
    function renderUI() {
        const app = document.getElementById('app');
        
        if (state.screen === "start") {
            app.innerHTML = `
                <div class="flex flex-col items-center justify-center flex-grow p-6 text-center space-y-6 my-auto">
                    <h1 class="text-3xl sm:text-4xl font-extrabold text-white tracking-wide">20-Rule Category Sorting Challenge</h1>
                    <p class="text-slate-400 text-sm sm:text-base max-w-md leading-relaxed">
                        Find the hidden sorting rule for each block!<br>
                        Get 5 correct in a row within 10 subtrials to master each rule.<br>There are 20 total blocks.
                    </p>
                    <button onclick="startGame()" class="bg-blue-600 hover:bg-blue-500 active:scale-95 text-white font-bold px-8 py-3.5 rounded-xl shadow-lg transition-all text-base">
                        START GAME (or press 'S')
                    </button>
                    <span class="text-xs text-slate-500">Shortcuts: Press 'S' to Start, 'Q' to Quit</span>
                </div>
            `;
        } 
        else if (state.screen === "game") {
            app.innerHTML = `
                <!-- Header Status -->
                <div class="bg-slate-950 py-3 px-6 flex justify-between items-center border-b border-slate-800 text-xs sm:text-sm font-semibold">
                    <span class="text-emerald-400">Rule ${state.currentBlock} / ${TOTAL_BLOCKS}</span>
                    <span class="text-slate-400">Subtrial ${state.currentSubtrial} / ${MAX_SUBTRIALS}</span>
                </div>

                <div class="flex flex-col items-center justify-center flex-grow p-4 sm:p-8 space-y-6">
                    <h2 class="text-xs sm:text-sm uppercase tracking-widest text-slate-400 font-bold">Click matching target card:</h2>

                    <!-- 4 Target Cards -->
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-4 w-full max-w-2xl">
                        ${TARGETS.map((t, idx) => `
                            <div onclick="makeChoice(${idx})" class="bg-white text-slate-900 rounded-xl p-4 shadow-md border-4 border-slate-700 hover:border-blue-500 cursor-pointer transition-all flex flex-col justify-between h-40 select-none active:scale-95">
                                <div class="font-bold text-base" style="color: ${COLOR_MAP[t.Color]}">${t.Color}</div>
                                <div class="text-base text-slate-800">${t.Letter}</div>
                                <div class="text-3xl text-slate-800">${t.Shape}</div>
                            </div>
                        `).join('')}
                    </div>

                    <!-- Stimulus Card -->
                    <div class="mt-4 flex flex-col items-center space-y-2">
                        <span class="text-xs text-slate-500 font-medium">Stimulus Card</span>
                        <div class="bg-white text-slate-900 rounded-xl p-4 shadow-xl border-4 border-blue-600 w-32 h-40 flex flex-col justify-between">
                            <div class="font-bold text-base" style="color: ${COLOR_MAP[state.currentCard.Color]}">${state.currentCard.Color}</div>
                            <div class="text-base text-slate-800">${state.currentCard.Letter}</div>
                            <div class="text-3xl text-slate-800">${state.currentCard.Shape}</div>
                        </div>
                    </div>

                    <!-- Feedback Display -->
                    <div class="h-8 flex items-center justify-center">
                        <span class="text-lg font-bold" style="color: ${state.feedbackColor}">${state.feedbackText}</span>
                    </div>
                </div>
            `;
        }
        else if (state.screen === "buffer") {
            const lastBlock = state.blockHistory[state.blockHistory.length - 1];
            const mastered = lastBlock.Mastered;
            const titleText = mastered ? `RULE ${state.currentBlock} MASTERED!` : `RULE ${state.currentBlock} COMPLETE`;
            const titleColor = mastered ? "text-emerald-400" : "text-rose-500";
            const detailMsg = mastered 
                ? `You figured out the rule in ${lastBlock.Subtrials_Taken} subtrials!` 
                : `Reached max ${MAX_SUBTRIALS} subtrials without mastering this rule.`;

            app.innerHTML = `
                <div class="flex flex-col items-center justify-center flex-grow p-8 text-center space-y-6 my-auto">
                    <h2 class="text-2xl sm:text-3xl font-extrabold ${titleColor}">${titleText}</h2>
                    <p class="text-slate-300 text-base">${detailMsg}</p>
                    <p class="text-slate-400 text-sm">Ready for Rule ${state.currentBlock + 1} of ${TOTAL_BLOCKS}?</p>
                    <button onclick="startNextBlockFromBuffer()" class="bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-slate-950 font-bold px-8 py-3.5 rounded-xl shadow-lg transition-all text-base">
                        CONTINUE TO NEXT RULE (or press SPACE)
                    </button>
                </div>
            `;
        }
        else if (state.screen === "results") {
            const totalFinished = state.blockHistory.length;
            const masteredCount = state.blockHistory.filter(b => b.Mastered).length;
            const subtrialCounts = state.blockHistory.map(b => b.Subtrials_Taken);
            const meanSubtrials = subtrialCounts.reduce((a, b) => a + b, 0) / (totalFinished || 1);

            let variance = 0;
            if (subtrialCounts.length > 1) {
                variance = subtrialCounts.reduce((a, b) => a + Math.pow(b - meanSubtrials, 2), 0) / (subtrialCounts.length - 1);
            }
            const stdDev = Math.sqrt(variance);

            let reportText = [
                "===========================================",
                " EXPERIMENT SUMMARY & ANALYTICS            ",
                "===========================================",
                `Rules Mastered: ${masteredCount} / ${totalFinished}`,
                `Mean Subtrials: ${meanSubtrials.toFixed(2)}`,
                `Std Deviation (σ): ${stdDev.toFixed(2)}`,
                "-------------------------------------------",
                "Rule # | Target Rule        | Status   | Subtrials Taken | Accuracy",
                "------------------------------------------------------------------"
            ];

            state.blockHistory.forEach(r => {
                let statusStr = r.Mastered ? "MASTERED" : "FAILED";
                let accVal = Math.round((r.Correct_Hits / r.Subtrials_Taken) * 100);
                reportText.push(
                    `Rule ${String(r.Block).padEnd(2)} | ${r.Rule.padEnd(18)} | ${statusStr.padEnd(8)} | ${String(r.Subtrials_Taken + " / 10").padEnd(15)} | ${accVal}%`
                );
            });

            const fullReport = reportText.join('\n');

            app.innerHTML = `
                <div class="flex flex-col h-[750px] p-4 sm:p-6 overflow-y-auto">
                    <h2 class="text-xl sm:text-2xl font-bold text-emerald-400 mb-2 text-center">EXPERIMENT SUMMARY & ANALYTICS</h2>
                    
                    <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl my-3 text-center shadow-inner">
                        <p class="text-sm sm:text-base font-bold text-white">
                            Rules Mastered: <span class="text-emerald-400">${masteredCount} / ${totalFinished}</span> &nbsp;|&nbsp; 
                            Mean Subtrials: <span class="text-blue-400">${meanSubtrials.toFixed(2)}</span> &nbsp;|&nbsp; 
                            Std Dev (σ): <span class="text-purple-400">${stdDev.toFixed(2)}</span>
                        </p>
                    </div>

                    <div class="flex justify-center gap-3 my-2">
                        <button onclick="navigator.clipboard.writeText(\`${fullReport}\`); alert('Results copied to clipboard!');" class="bg-sky-600 hover:bg-sky-500 active:scale-95 text-white font-bold px-5 py-2 rounded-xl shadow transition-all text-xs sm:text-sm">
                            📋 Copy Results to Clipboard
                        </button>
                        <button onclick="window.location.reload()" class="bg-blue-600 hover:bg-blue-500 active:scale-95 text-white font-bold px-5 py-2 rounded-xl shadow transition-all text-xs sm:text-sm">
                            🔄 Play Again
                        </button>
                    </div>

                    <div class="flex-grow flex flex-col mt-3">
                        <span class="text-xs font-bold text-slate-400 mb-1">Detailed Log:</span>
                        <textarea readonly class="w-full flex-grow bg-slate-950 text-slate-300 font-mono text-xs p-3 rounded-xl border border-slate-800 resize-none focus:outline-none">${fullReport}</textarea>
                    </div>
                </div>
            `;
        }
    }

    // Initial Launch
    window.addEventListener('DOMContentLoaded', () => {
        renderUI();
    });
  </script>
</body>
</html>
